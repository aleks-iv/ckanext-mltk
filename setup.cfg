[extract_messages]
keywords = translate isPlural
add_comments = TRANSLATORS:
output_file = ckanext/mltk/i18n/ckanext-mltk.pot
width = 80

[init_catalog]
domain = ckanext-mltk
input_file = ckanext/mltk/i18n/ckanext-mltk.pot
output_dir = ckanext/mltk/i18n

[update_catalog]
domain = ckanext-mltk
input_file = ckanext/mltk/i18n/ckanext-mltk.pot
output_dir = ckanext/mltk/i18n
previous = true

[compile_catalog]
domain = ckanext-mltk
directory = ckanext/mltk/i18n
statistics = true
